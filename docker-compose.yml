services:
  # --- BACKEND (FastAPI + OpenCV + fontmake) ---
  backend:
    build:
      context: ./backend
    container_name: soulscript_backend
    restart: unless-stopped
    ports:
      - "8000:8000"

  # --- FRONTEND (React + Nginx con proxy hacia el backend) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: soulscript_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
